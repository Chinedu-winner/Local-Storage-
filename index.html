<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 via-indigo-100 to-purple-200 flex items-center justify-center p-5">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl p-8">

    <!-- Heading -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Create Account</h1>
      <p class="text-gray-500 mt-2">Fill in your details to get started.</p>
    </div>

    <!-- Form -->
    <form action="#" method="POST" class="space-y-5">

      <!-- Full Name -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Full Name</label>
        <input type="text" placeholder="Enter your full name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Email Address</label>
        <input type="email" placeholder="example@email.com" required class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
      </div>

      <!-- Phone -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Phone Number</label>
        <input type="tel" placeholder="Enter your phone number" class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
      </div>

      <!-- Password -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Password</label>
        <input type="password"placeholder="Enter your password"requiredminlength="8"class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Confirm Password</label>
        <input type="password" placeholder="Confirm your password" required minlength="8" class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
      </div>

      <!-- Gender -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Gender</label>
        <select requiredclass="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Prefer not to say</option>
        </select>
      </div>

    <!-- Terms -->
    <div class="flex items-center gap-2">
        <input type="checkbox" requiredclass="w-4 h-4 accent-blue-600">
        <label class="text-sm text-gray-600">I agree to the Terms and Conditions.</label>
      </div>

      <!-- Submit Button -->
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-xl transition duration-300">Create Account</button>
    </form>

    <!-- Login Link -->
    <p class="text-center text-gray-500 mt-6 text-sm">Already have an account? <a href="#" class="text-blue-600 font-semibold hover:underline">Sign In</a>
    </p>
  </div>

</body>
</html>
